units:
  column2: 5
  column3: 14
  column4: 0
  column5: -14
  column6: -5
  key_degrees: 25
  key_radians: key_degrees * pi / 180.0
  thumb_radius: (1/tan(key_radians) + 0.5)*cx
  thumb3_y: -1.5 * cy
  thumb2_y: thumb3_y - thumb_radius + thumb_radius * cos(key_radians)
  thumb1_y: thumb3_y - thumb_radius + thumb_radius * cos(2*key_radians)
  thumb3_x: 0
  thumb2_x: thumb3_x - thumb_radius * sin(key_radians)
  thumb1_x: thumb3_x - thumb_radius * sin(2*key_radians)
points:
  zones:
    main:
      key:
        padding: cy
      columns:
        column1:
          spread: cx
        column2:
          stagger: column2
          spread: cx
        column3:
          stagger: column3
          spread: cx
        column4:
          stagger: column4
          spread: cx
        column5:
          stagger: column5
          spread: cx
        column6:
          spread: cx
          stagger: column6
          row_overrides:
            row1:
            row2:
      rows:
        row1:
        row2:
        row3:
    thumb:
      anchor:
        ref: main_column2_row1
        shift: [thumb1_x, thumb1_y]
      columns:
        thumb1:
          row_overrides:
            row1:
              rotate: 2*key_degrees
        thumb2:
          #stagger: thumb_radius*cos(key_radians)*U - thumb_radius*cos(key_radians*2)*U
          stagger: thumb2_y - thumb1_y
          spread: thumb2_x - thumb1_x
          row_overrides:
            row1:
              rotate: key_degrees
        thumb3:
          stagger: thumb3_y - thumb2_y
          spread: thumb3_x - thumb2_x
          row_overrides:
            row1:
outlines:
  exports:
    switches:
      - type: keys
        side: left
        size: [cx-0.5, cy-0.5]
        corner: 1
